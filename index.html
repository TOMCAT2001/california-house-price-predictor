<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House price estimator</title>
<style>
:root {
  --fog: #E9EFF2;
  --paper: #F8FAFB;
  --ink: #14232B;
  --muted: #566871;
  --sea: #0E6E7E;
  --sea-dark: #0A5260;
  --sun: #E8A21A;
  --line: #C4D1D8;
  --land: #D3E2E6;
  --danger: #B3261E;
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-family: var(--font); }
body { margin: 0; background: var(--fog); color: var(--ink); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 56px; }

header h1 { margin: 0 0 6px; font-size: 2.1rem; font-weight: 700; letter-spacing: -0.02em; }
header p { margin: 0; max-width: 62ch; color: var(--muted); }

.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 28px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

.form-panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.form-panel h2 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 700; }

.cities { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.chip { font: inherit; font-size: 0.9rem; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--sea); }
.chip[aria-pressed="true"] { background: var(--sea); border-color: var(--sea); color: #fff; }

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
@media (max-width: 480px) { .fields { grid-template-columns: 1fr; } }
.field label { display: block; font-size: 0.92rem; font-weight: 600; margin-bottom: 2px; }
.field input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
.field input:focus-visible { outline: 3px solid var(--sun); outline-offset: 1px; border-color: var(--sea); }
.field small { display: block; margin-top: 2px; color: var(--muted); font-size: 0.8rem; line-height: 1.4; min-height: 1.2em; }

.submit { margin-top: 22px; width: 100%; font: inherit; font-weight: 700; font-size: 1.05rem; padding: 12px; border: 0; border-radius: 10px; background: var(--sea); color: #fff; cursor: pointer; }
.submit:hover { background: var(--sea-dark); }
.submit:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.submit:disabled { opacity: 0.6; cursor: wait; }

.stage { position: sticky; top: 20px; }
@media (max-width: 820px) { .stage { position: static; } }
.map-box { background: var(--paper); border: 1px solid var(--line); border-radius: 18px 6px 18px 6px; padding: 10px; }
.map-box svg { display: block; width: 100%; height: auto; cursor: crosshair; }
.land { fill: var(--land); stroke: var(--sea); stroke-width: 1.6; stroke-linejoin: round; }
.city-dot { fill: var(--sea); }
.city-label { font-size: 11px; fill: var(--muted); font-family: var(--font); }
.pin { transition: transform 0.35s ease; }
.pin .halo { fill: var(--sun); opacity: 0.28; }
.pin .dot { fill: var(--sun); stroke: var(--ink); stroke-width: 1.5; }
@media (prefers-reduced-motion: reduce) { .pin { transition: none; } }
.map-hint { margin: 6px 4px 0; font-size: 0.8rem; color: var(--muted); }

.result { margin-top: 16px; padding: 16px 18px; border-left: 4px solid var(--sea); background: var(--paper); border-radius: 12px 4px 4px 12px; min-height: 120px; }
.result.error { border-left-color: var(--danger); }
.result .idle { color: var(--muted); margin: 0; }
.result .label { margin: 0; color: var(--muted); font-size: 0.9rem; }
.result .price { margin: 0; font-size: 2.4rem; font-weight: 800; line-height: 1.25; letter-spacing: -0.02em; color: var(--sea-dark); }
.result .range { margin: 2px 0 10px; font-size: 0.95rem; }
.result .note { margin: 0; font-size: 0.82rem; color: var(--muted); }
.result .err { margin: 0; color: var(--danger); font-weight: 600; }
.result .err-help { margin: 4px 0 0; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>House price estimator</h1>
    <p>Describe a California neighborhood and the model estimates its median house value.</p>
  </header>

  <div class="layout">
    <form class="form-panel" id="form" novalidate>
      <h2>Jump to a city</h2>
      <div class="cities" id="cities"></div>
      <div class="fields" id="fields"></div>
      <button class="submit" type="submit" id="submit">Estimate price</button>
    </form>

    <section class="stage" aria-label="Map and result">
      <div class="map-box">
        <svg id="map" viewBox="0 0 380 440" role="img" aria-label="Map of California with the selected location"></svg>
        <p class="map-hint">Click the map to move the pin.</p>
      </div>
      <div class="result" id="result" aria-live="polite">
        <p class="idle">Fill in the neighborhood details and select Estimate price.</p>
      </div>
    </section>
  </div>
</div>

<script>
const FIELDS = [
  { k: "MedInc", label: "Median income", hint: "In $10,000 units: 3.5 = $35,000", min: 0.5, max: 15, def: 3.5 },
  { k: "HouseAge", label: "Median house age", hint: "Years, 1 to 52", min: 1, max: 52, def: 29 },
  { k: "AveRooms", label: "Average rooms per house", hint: "1 to 20", min: 1, max: 20, def: 5 },
  { k: "AveBedrms", label: "Average bedrooms per house", hint: "0.5 to 5", min: 0.5, max: 5, def: 1 },
  { k: "Population", label: "Population", hint: "People in the neighborhood", min: 3, max: 35000, def: 1200 },
  { k: "AveOccup", label: "Average occupants per house", hint: "People, 0.5 to 20", min: 0.5, max: 20, def: 3 },
  { k: "Latitude", label: "Latitude", hint: "32.5 to 42", min: 32.5, max: 42, def: 34.2 },
  { k: "Longitude", label: "Longitude", hint: "-124.5 to -114", min: -124.5, max: -114, def: -118.5 },
];

const CITIES = [
  { n: "Los Angeles", lat: 34.05, lon: -118.25 },
  { n: "San Francisco", lat: 37.77, lon: -122.42 },
  { n: "San Diego", lat: 32.72, lon: -117.16 },
  { n: "San Jose", lat: 37.34, lon: -121.89 },
  { n: "Sacramento", lat: 38.58, lon: -121.49 },
  { n: "Fresno", lat: 36.74, lon: -119.79 },
];

// Simplified California outline as [longitude, latitude]
const OUTLINE = [
  [-124.2, 42.0], [-124.2, 41.75], [-124.1, 41.0], [-124.4, 40.4], [-124.0, 40.0], [-123.8, 39.4],
  [-123.7, 38.9], [-123.0, 38.3], [-123.0, 38.0], [-122.5, 37.8], [-122.4, 37.5], [-122.1, 36.95],
  [-121.9, 36.6], [-121.5, 36.0], [-121.0, 35.5], [-120.65, 35.15], [-120.6, 34.55], [-120.45, 34.45],
  [-119.7, 34.4], [-119.2, 34.15], [-118.6, 34.03], [-118.4, 33.75], [-118.1, 33.75], [-117.9, 33.6],
  [-117.4, 33.2], [-117.25, 32.7], [-117.12, 32.53], [-114.72, 32.72], [-114.5, 33.0], [-114.7, 33.4],
  [-114.5, 33.9], [-114.4, 34.3], [-114.6, 34.8], [-114.63, 35.0], [-120.0, 39.0], [-120.0, 42.0],
];

const W = 380, H = 440;
const px = lon => 20 + (lon + 124.6) * 32;
const py = lat => 20 + (42.2 - lat) * 40;
const unpx = x => (x - 20) / 32 - 124.6;
const unpy = y => 42.2 - (y - 20) / 40;

const $ = id => document.getElementById(id);
const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const inputs = {};

// ---- Build the form ----
FIELDS.forEach(f => {
  const wrap = document.createElement("div");
  wrap.className = "field";
  wrap.innerHTML = `<label for="${f.k}">${f.label}</label>
    <input id="${f.k}" name="${f.k}" type="number" inputmode="decimal" step="any"
           min="${f.min}" max="${f.max}" value="${f.def}" required>
    <small>${f.hint}</small>`;
  $("fields").appendChild(wrap);
  inputs[f.k] = wrap.querySelector("input");
});

// ---- Build the map ----
const outlinePath = OUTLINE.map((p, i) => `${i ? "L" : "M"}${px(p[0]).toFixed(1)},${py(p[1]).toFixed(1)}`).join(" ") + " Z";
let svg = `<path class="land" d="${outlinePath}"/>`;
CITIES.forEach(c => {
  svg += `<circle class="city-dot" cx="${px(c.lon)}" cy="${py(c.lat)}" r="2.6"/>
          <text class="city-label" x="${px(c.lon) + 8}" y="${py(c.lat) + 4}">${c.n}</text>`;
});
svg += `<g class="pin" id="pin"><circle class="halo" r="14"/><circle class="dot" r="6"/></g>`;
$("map").innerHTML = svg;

function movePin() {
  const lat = parseFloat(inputs.Latitude.value);
  const lon = parseFloat(inputs.Longitude.value);
  if (Number.isNaN(lat) || Number.isNaN(lon)) return;
  const x = Math.min(Math.max(px(lon), 0), W);
  const y = Math.min(Math.max(py(lat), 0), H);
  $("pin").style.transform = `translate(${x}px, ${y}px)`;
}

// ---- City selection ----
function setLocation(lat, lon, cityIndex) {
  inputs.Latitude.value = lat.toFixed(2);
  inputs.Longitude.value = lon.toFixed(2);
  document.querySelectorAll(".chip").forEach((b, i) =>
    b.setAttribute("aria-pressed", i === cityIndex ? "true" : "false"));
  movePin();
}

CITIES.forEach((c, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip";
  b.textContent = c.n;
  b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", () => setLocation(c.lat, c.lon, i));
  $("cities").appendChild(b);
});

["Latitude", "Longitude"].forEach(k =>
  inputs[k].addEventListener("input", () => {
    document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", "false"));
    movePin();
  }));

$("map").addEventListener("click", e => {
  const r = $("map").getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  const y = (e.clientY - r.top) / r.height * H;
  const lat = Math.min(Math.max(unpy(y), 32.5), 42);
  const lon = Math.min(Math.max(unpx(x), -124.5), -114);
  setLocation(lat, lon, -1);
});

movePin();

// ---- Result display ----
function showIdle(html) { $("result").className = "result"; $("result").innerHTML = html; }

function showPrice(price) {
  const rounded = Math.round(price / 1000) * 1000;
  const lo = Math.max(0, rounded - 42000);
  const hi = rounded + 42000;
  $("result").className = "result";
  $("result").innerHTML = `
    <p class="label">Estimated median house value</p>
    <p class="price">${usd.format(rounded)}</p>
    <p class="range">Likely range: ${usd.format(lo)} to ${usd.format(hi)}</p>
    <p class="note">Typical model error is about $42,000. Not reliable above $500,000. Trained on 1990 California census data, so values are not current market prices.</p>`;
}

function showError(msg, help) {
  $("result").className = "result error";
  $("result").innerHTML = `<p class="err">${msg}</p>${help ? `<p class="err-help">${help}</p>` : ""}`;
}

// ---- Send to the model ----
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!$("form").reportValidity()) return;

  const payload = {};
  FIELDS.forEach(f => { payload[f.k] = parseFloat(inputs[f.k].value); });

  $("submit").disabled = true;
  showIdle('<p class="idle">Estimating…</p>');

  try {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Unknown error");
    showPrice(data.price);
  } catch (err) {
    showError("Couldn't reach the model.",
      "Make sure server.py is running and open the page at http://127.0.0.1:5000 instead of double-clicking the file.");
  } finally {
    $("submit").disabled = false;
  }
});
</script>
</body>
</html>
